<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E9914" />
      <stop offset="100%" stop-color="#155306" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield/Badge -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#4ade80" stroke-width="8" stroke-opacity="0.4" />
  
  <g filter="url(#shadow)">
    <!-- Family 100 Board Design -->
    <rect x="76" y="90" width="360" height="230" rx="20" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="12" />
    
    <!-- Answer Slots inside Board -->
    <rect x="100" y="115" width="312" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="120" y="142" font-family="sans-serif" font-weight="900" font-size="22" fill="#FCD34D">1. INFORMATIKA</text>
    <text x="385" y="142" font-family="sans-serif" font-weight="900" font-size="22" fill="#4ade80" text-anchor="end">40</text>

    <rect x="100" y="165" width="312" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="120" y="192" font-family="sans-serif" font-weight="900" font-size="22" fill="#FCD34D">2. PROGRAMMING</text>
    <text x="385" y="192" font-family="sans-serif" font-weight="900" font-size="22" fill="#4ade80" text-anchor="end">30</text>

    <rect x="100" y="215" width="312" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="120" y="242" font-family="sans-serif" font-weight="900" font-size="22" fill="#FCD34D">3. HARDWARE</text>
    <text x="385" y="242" font-family="sans-serif" font-weight="900" font-size="22" fill="#4ade80" text-anchor="end">20</text>
    
    <!-- Big 100 Badge at Bottom -->
    <circle cx="256" cy="380" r="85" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="6"/>
    <text x="256" y="392" font-family="sans-serif" font-weight="900" font-size="62" fill="#0f172a" text-anchor="middle">100</text>
    <text x="256" y="430" font-family="sans-serif" font-weight="800" font-size="18" fill="#1e293b" text-anchor="middle">FAMILY</text>
  </g>
</svg>
